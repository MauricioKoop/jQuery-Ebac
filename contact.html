<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="contact.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="section-contact">
            <h1>Contato</h1>
            <h2>Fale Conosco</h2>
            <form id="contact-form">
                <label for="name"></label>
                <input type="text" id="name" name="name" placeholder="Digite seu Nome">
                <label for="email"></label>
                <input type="email" id="email" name="email" placeholder="Digite seu E-mail">
                <label for="message"></label>
                <textarea type="text" id="message" name="message" placeholder="Escreva sua mensagem aqui..."></textarea>
                <button type="submit">Enviar</button>
            </form>

            <div class="contact-info">
                <h3>Informações de contato</h3>
                <p>Endereço: Rua Alice Schultz, 666 - Santa Catarina, SC</p>
                <p>Telefone: (47)96666-6666</p>
                <p>E-mail: teste@teste.com.br</p>
                <p>Horário de Atendimento: Segunda à Sexta, 9h as 18h</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 EBAC Ecommerce V1</p>
    </footer>

    <script src="contact.js"></script>
</body>
</html>
